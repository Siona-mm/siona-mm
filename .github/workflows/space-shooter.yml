name: Generate Space Shooter Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-game:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate Space Shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'gh-space-shooter.gif'
          
          # --- Customization Options ---
          strategy: 'column'           # Game animation pattern: 'random', 'column', 'row', 'snake'
          theme: 'dark'                # Background mode: 'dark' or 'light'
          
          # Custom contribution block colors (Hex codes)
          color-0: '#161b22'           # Empty cell (No commits)
          color-1: '#0e4429'           # Level 1 commits
          color-2: '#006d32'           # Level 2 commits
          color-3: '#26a641'           # Level 3 commits
          color-4: '#39d353'           # Level 4 commits (Max)
