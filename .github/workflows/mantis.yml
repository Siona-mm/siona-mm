name: Update Orchid Mantis SVG

on:
  schedule:
    # Syncs your live commits every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_mantis.py"
      - ".github/workflows/mantis.yml"

permissions:
  contents: write

jobs:
  build-mantis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Orchid Mantis SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_mantis.py

      - name: Commit and push updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f mantis-matrix.gif || true
          git add mantis.svg
          git diff --staged --quiet || git commit -m "chore: update orchid mantis svg"
          git push
