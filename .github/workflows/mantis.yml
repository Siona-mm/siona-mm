name: Update Orchid Mantis Matrix

on:
  schedule:
    # Runs every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch: # Lets you run it manually anytime with 1 click
  push:
    paths:
      - "scripts/generate_mantis.py"
      - ".github/workflows/mantis.yml"

permissions:
  contents: write

jobs:
  build-mantis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow numpy

      - name: Generate Orchid Mantis GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_mantis.py

      - name: Commit and push updated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mantis-matrix.gif
          git diff --staged --quiet || git commit -m "chore: update orchid mantis matrix"
          git push
